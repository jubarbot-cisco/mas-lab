# MAS Library Metadata — MAD
# Multi-Agent Debate (mad_attack_env) ported onto mas-lab: the debate
# protocol as design-pattern plugins, plus a context manager that keeps an
# adversary's private planning out of its own later prompts.
#
# Registered through the runtime plugin registry — see
# runtime/docs/plugin-registry-manifests.md.

apiVersion: mas/v1
kind: Library

name: mas-library-mad
description: >
  Multi-agent debate (MAD) attack-environment semantics for mas-lab:
  mad_debate (protocol coordinator), mad_turn (one published seat turn),
  and mad_redact (private-planning context filter).
version: "0.1.0"

module_base: mas.library.mad

types:
  - design_pattern
  - context_manager

plugins:
  - type: design_pattern
    name: mad_debate
    urn: mas.dp.mad_debate
    module: mas.library.mad.plugins.mad_debate
    class: MadDebatePlugin
  - type: design_pattern
    name: mad_turn
    urn: mas.dp.mad_turn
    module: mas.library.mad.plugins.mad_turn
    class: MadTurnPlugin
  - type: context_manager
    name: mad_redact
    urn: mas.cm.mad_redact
    module: mas.library.mad.plugins.mad_redact
    class: MadRedactConversation
