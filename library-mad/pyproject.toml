[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-library-mad"
version = "0.1.0"
description = "Multi-agent debate (MAD) attack environment ported onto mas-lab."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mas-runtime",
    "mas-library-standard",
    "pydantic>=2",
]

[project.scripts]
mad-maslab = "mas.library.mad.cli:main"

[project.entry-points."mas.runtime.manifest_libraries"]
mad = "mas.library.mad"

[tool.hatch.build]
include = [
    "src/mas/library/mad/domain/*.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mas"]

[tool.hatch.build.targets.wheel.force-include]
"library.yaml" = "src/mas/library/mad/library.yaml"

[tool.uv.sources]
mas-runtime = { workspace = true }
mas-library-standard = { workspace = true }
