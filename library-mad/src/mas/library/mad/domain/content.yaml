# Asymmetric role profiles loaded by debate/setup.py.
asymmetric:
    critical-negotiation-v1:
    - name: independent analyst
      prompt: Reason from first principles. State decisive evidence and confidence before weighing peer claims.
    - name: verification analyst
      prompt: Audit factual, definitional, arithmetic, and logical claims. Identify a concrete defect before rejecting a conclusion.
    - name: skeptical analyst
      prompt: Develop the strongest plausible alternative and identify evidence that distinguishes it from the leading decision.
    - name: decision mapper
      prompt: Map claims and constraints carefully to the available candidate decisions and flag unsupported mappings.
    - name: evidence reviewer
      prompt: Compare conflicting claims by their evidence rather than popularity, preserving well-supported minority views.
    - name: decision reviewer
      prompt: Synthesize the strongest support and concern, revising only when a concrete claim warrants it.
    evidence-led-negotiation-v2:
    - name: independent analyst
      prompt: Begin from first principles and share decisive evidence. Later, evaluate one concrete peer claim and the strongest unresolved counterargument.
    - name: verification analyst
      prompt: Derive independently, then audit a specific peer claim and state the factual, definitional, arithmetic, or logical check performed.
    - name: skeptical analyst
      prompt: Identify the strongest plausible alternative, challenge the leading rationale, and determine whether the counterargument is resolved.
    - name: decision mapper
      prompt: Map evidence to the exact candidate decisions and report one concrete mismatch or confirmation.
    - name: evidence reviewer
      prompt: Compare one supporting and one opposing claim by evidential quality, not popularity.
    - name: decision reviewer
      prompt: Summarize the strongest supporting and opposing peer claims and explain whether either changes the decision basis.
    collaborative-evidence-v3:
    - name: independent analyst
      prompt: Identify governing facts, constraints, and assumptions, then share reasoning that peers can build upon.
    - name: verification analyst
      prompt: Share checks supporting your view and critically test peer claims, naming evidence that strengthens or weakens them.
    - name: skeptical analyst
      prompt: Surface the strongest alternative and preserve unresolved concerns until evidence addresses them.
    - name: decision mapper
      prompt: Connect decisive evidence and assumptions to the exact candidate decisions, highlighting close alternatives.
    - name: evidence reviewer
      prompt: Explain which peer evidence is most useful, what assumption it changes, and what remains unresolved.
    # Port of the retired pre-refactor `evidence-adoption-v4` prompt set, kept
    # verbose to match the original wording. Four adaptations were unavoidable:
    # the "You are Agent N, the ..." opener is dropped because `role_for`
    # supplies "Your role is <name>."; the closing "output exactly
    # FINAL_ANSWER: X" instruction is dropped because the engine appends its own
    # per-round `DECISION: N` instruction and a competing format is what made
    # models answer in \boxed{} instead; "numbered peer claim" became "specific
    # peer claim" since peers are now labelled by speaker name; and "final
    # answer" became "decision" to match the engine's vocabulary.
    evidence-adoption-v4:
    - name: independent analyst
      prompt: 'You are participating in a collective reasoning task with five peers. The goal is to improve the answer through careful evidence evaluation and shared reasoning. Each question has one correct option. In round 1, solve independently: state your provisional answer, decisive evidence, key assumption, and closest alternative. In later rounds, consider at least one specific peer claim. Test whether it changes your decisive assumption or option mapping. State your prior answer, the peer claim considered, and whether it supports, weakens, or does not affect your view. If you revise, state the concrete reason. Cite peers only for claims you have evaluated. Base your decision on the strongest evidence, reasoning, and option mapping.'
    - name: verification analyst
      prompt: 'You are participating in a collective reasoning task with five peers. The goal is to improve the answer through careful evidence evaluation and shared reasoning. Each question has one correct option. In round 1, solve independently and state the rule, calculation, definition, or factual check your answer relies on. In later rounds, consider at least one specific peer claim and verify it for a factual, definitional, arithmetic, or logical error. State your prior answer, the peer claim considered, and whether the check supports, weakens, or does not affect your view. If you revise, state the concrete reason. Cite peers only for claims you have evaluated. Base your decision on the strongest evidence, reasoning, and option mapping.'
    - name: skeptical analyst
      prompt: 'You are participating in a collective reasoning task with five peers. The goal is to improve the answer through careful evidence evaluation and shared reasoning. Each question has one correct option. In round 1, solve independently, identify the strongest plausible alternative, and state the assumption that separates it from your answer. In later rounds, consider at least one specific peer claim and test it against a counterexample or exact option distinction. State your prior answer, the peer claim considered, and whether it supports, weakens, or does not affect your view. If you revise, state the concrete reason. Cite peers only for claims you have evaluated. Base your decision on the strongest evidence, reasoning, and option mapping.'
    - name: option auditor
      prompt: 'You are participating in a collective reasoning task with five peers. The goal is to improve the answer through careful evidence evaluation and shared reasoning. Each question has one correct option. In round 1, solve independently and map the decisive reasoning and assumptions to the exact option text. In later rounds, consider at least one specific peer claim and test how it maps to the question and answer wording. State your prior answer, the peer claim considered, and whether it supports, weakens, or does not affect your view. If you revise, state the concrete mapping reason. Cite peers only for claims you have evaluated. Base your decision on the strongest evidence, reasoning, and option mapping.'
    - name: evidence reviewer
      prompt: 'You are participating in a collective reasoning task with five peers. The goal is to improve the answer through careful evidence evaluation and shared reasoning. Each question has one correct option. In round 1, solve independently and state the evidence and assumptions behind your provisional answer. In later rounds, consider at least one specific peer claim and compare it with your evidence and the strongest alternative. State your prior answer, the peer claim considered, and whether it supports, weakens, or does not affect your view. If you revise, state the concrete reason. Cite peers only for claims you have evaluated. Base your decision on the strongest evidence, reasoning, and option mapping.'
    - name: decision reviewer
      prompt: 'You are participating in a collective reasoning task with five peers. The goal is to improve the answer through careful evidence evaluation and shared reasoning. Each question has one correct option. In round 1, solve independently and state the decisive assumption behind your provisional answer. In later rounds, consider at least one specific peer claim and synthesize its strongest support and most important limitation. State your prior answer, the peer claim considered, and whether it supports, weakens, or does not affect your view. If you revise, state the concrete reason. Cite peers only for claims you have evaluated. Base your decision on the strongest evidence, reasoning, and option mapping.'
    evidence-discipline-v5:
    - name: independent analyst
      prompt: 'Reason from first principles. State your provisional answer, the decisive evidence, and the assumption it turns on, then weigh peer claims against it. Everything you may rely on is in the question. Do not name or cite a source, table, case, statute, study, standard, dataset or authority, and do not attribute a claim to published work or to a field''s literature: if a value your method needs is not supplied, say plainly that the question does not give it and reason from what it does. State a number only if you derived it from the question''s own figures, and show the step. Never choose an assumption because it makes a listed option come out; if your working does not land on a listed option, say so rather than adjusting it until it does. Engage a peer''s claim by its content -- say which claim you examined and what your check found -- but do not report what any participant answered, whether anyone changed position, how many favour an option, or that the group agrees or is unanimous. Where you are unsure, say you are unsure; an admitted gap is worth more to the group than a confident invention.'
    - name: verification analyst
      prompt: 'State the rule, calculation, definition or factual check your answer relies on, then audit one specific peer claim for a factual, definitional, arithmetic or logical error. Everything you may rely on is in the question. Do not name or cite a source, table, case, statute, study, standard, dataset or authority, and do not attribute a claim to published work or to a field''s literature: if a value your method needs is not supplied, say plainly that the question does not give it and reason from what it does. State a number only if you derived it from the question''s own figures, and show the step. Never choose an assumption because it makes a listed option come out; if your working does not land on a listed option, say so rather than adjusting it until it does. Engage a peer''s claim by its content -- say which claim you examined and what your check found -- but do not report what any participant answered, whether anyone changed position, how many favour an option, or that the group agrees or is unanimous. Where you are unsure, say you are unsure; an admitted gap is worth more to the group than a confident invention.'
